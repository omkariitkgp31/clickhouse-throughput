version: '3.8'
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-broker
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 2
      - --default-log-level=info
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health" ]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fleet-redis
    command: redis-server --client-output-buffer-limit pubsub 0 0 0
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: fleet-clickhouse
    environment:
      CLICKHOUSE_DB: fleet
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./db/init.clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  init-kafka:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: init-kafka
    entrypoint: [ "bash", "-c", "rpk topic create telemetry -p 10 --brokers redpanda:9092 || true" ]
    depends_on:
      redpanda:
        condition: service_healthy

  ingestion-api-1:
    build:
      context: .
      dockerfile: ./src/services/ingestion-api/Dockerfile
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=telemetry
      - PORT=8080
      - DEBUG_INSTANCE_HEADER=true
    depends_on:
      init-kafka:
        condition: service_completed_successfully

  ingestion-api-2:
    build:
      context: .
      dockerfile: ./src/services/ingestion-api/Dockerfile
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=telemetry
      - PORT=8080
      - DEBUG_INSTANCE_HEADER=true
    depends_on:
      init-kafka:
        condition: service_completed_successfully

  ingestion-api-3:
    build:
      context: .
      dockerfile: ./src/services/ingestion-api/Dockerfile
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=telemetry
      - PORT=8080
      - DEBUG_INSTANCE_HEADER=true
    depends_on:
      init-kafka:
        condition: service_completed_successfully

  stream-processor-1:
    build:
      context: .
      dockerfile: ./src/services/stream-processor/Dockerfile
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=telemetry
      - KAFKA_GROUP=stream-processor-group
      - REDIS_ADDR=redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DB=fleet
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      redis:
        condition: service_started
      clickhouse:
        condition: service_healthy

  stream-processor-2:
    build:
      context: .
      dockerfile: ./src/services/stream-processor/Dockerfile
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=telemetry
      - KAFKA_GROUP=stream-processor-group
      - REDIS_ADDR=redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DB=fleet
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      redis:
        condition: service_started
      clickhouse:
        condition: service_healthy

  stream-processor-3:
    build:
      context: .
      dockerfile: ./src/services/stream-processor/Dockerfile
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=telemetry
      - KAFKA_GROUP=stream-processor-group
      - REDIS_ADDR=redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DB=fleet
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      redis:
        condition: service_started
      clickhouse:
        condition: service_healthy

  query-api:
    build:
      context: .
      dockerfile: ./src/services/query-api/Dockerfile
    container_name: query-api
    ports:
      - "8081:8081"
    environment:
      - REDIS_ADDR=redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DB=fleet
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - PORT=8081
    depends_on:
      redis:
        condition: service_started
      clickhouse:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "80:80"
    depends_on:
      - ingestion-api-1
      - ingestion-api-2
      - ingestion-api-3
      - query-api

  loadtest:
    build:
      context: .
      dockerfile: ./cmd/loadtest/Dockerfile
    container_name: fleet-loadtest
    profiles: [ "loadtest" ]
    environment:
      - API_HOST=api-gateway
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DB=fleet
    depends_on:
      api-gateway:
        condition: service_started
      clickhouse:
        condition: service_healthy
